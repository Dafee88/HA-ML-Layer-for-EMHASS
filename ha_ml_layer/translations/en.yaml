configuration:
  ha_url:
    name: Home Assistant URL
    description: Leave as http://supervisor/core when running as an add-on.
  poll_interval_seconds:
    name: Poll interval (seconds)
    description: How often sensors are read and the models learn. 300 is recommended.
  log_level:
    name: Log level
    description: How much detail to write to the add-on log.
  pv_enabled:
    name: PV forecast correction
    description: Correct the Solcast forecast and publish sensor.pv_ml_corrected_forecast and sensor.pv_ml_corrected_forecast_curve for EMHASS.
  thermal_enabled:
    name: Building thermal model
    description: Learn cooling and heating rates per floor (sensor.building_thermal_<floor>).
  latitude:
    name: Latitude
    description: Optional. Site latitude in degrees for sun position and clear-sky irradiance. Empty = location from the Home Assistant configuration.
  longitude:
    name: Longitude
    description: Optional. Site longitude in degrees. Empty = location from the Home Assistant configuration.
  timezone:
    name: Time zone
    description: Optional. IANA time zone, e.g. Europe/Berlin. Empty = time zone of Home Assistant.
  pv_solcast_today:
    name: Solcast forecast today
    description: Solcast sensor with the detailedForecast attribute for today (Solcast PV Forecast integration from HACS, "Forecast today").
  pv_solcast_tomorrow:
    name: Solcast forecast tomorrow
    description: Solcast sensor with the detailedForecast attribute for tomorrow.
  pv_actual_power:
    name: Actual PV power (W)
    description: Sensor with the current total PV power in watts, e.g. from your inverter. The models learn from it.
  pv_actual_power_fallback:
    name: Actual PV power fallback (W)
    description: Optional. Used when the main PV power sensor is unavailable.
  pv_irradiance:
    name: Solar irradiance (W/m²)
    description: Optional local weather station sensor. Enables the real-time nowcast, the station plant model (stand-in for curtailed power) and the offline fallback when the forecast APIs have no data. Also the sun filter of the thermal model.
  pv_forecast_solar_today:
    name: Second forecast today (kWh)
    description: Optional, e.g. Forecast.Solar "Estimated energy production - today" (kWh). Forecast.Solar already combines several roof planes into one sensor; several sensors separated by commas are summed. Extra input for the day-ahead model.
  pv_forecast_solar_tomorrow:
    name: Second forecast tomorrow (kWh)
    description: Optional, same as above for tomorrow (e.g. Forecast.Solar "Estimated energy production - tomorrow").
  pv_curtailed_entity:
    name: Curtailment indicator
    description: Optional binary_sensor or input_boolean that is 'on' while PV may be curtailed (full battery, export limit). Then the station's potential power is learned instead of the curtailed actual power.
  pv_reference_irradiance:
    name: Reference irradiance (W/m²)
    description: Optional nearby professional station (e.g. GeoSphere/DWD integration). Only used to track the calibration factor of your own sensor (attribute irradiance_vs_reference).
  pv_peak_power_kw:
    name: PV peak power (kWp)
    description: Optional. Used to report the error as nMAE in percent of the peak power.
  thermal_outdoor_temp:
    name: Outdoor temperature
    description: Outdoor temperature sensor (°C) for the thermal model.
  thermal_outdoor_temp_fallback:
    name: Outdoor temperature fallback
    description: Optional. Used when the main outdoor sensor is unavailable.
  thermal_heating_stage:
    name: Heating stage selector
    description: Optional input_select; heating counts as on for a floor whose name equals its state. Leave empty if you have none.
  thermal_floors:
    name: Floors
    description: One entry per floor - name (lower case), temperature_sensor, and one heating signal - heating_switch (on/off), heating_power_sensor (W, on above the threshold; also used for the energy balance) or climate (hvac_action).
  thermal_heating_power_threshold_w:
    name: Heating power threshold (W)
    description: Optional, default 100. With heating_power_sensor, heating counts as on above this power.
  thermal_nominal_power_w:
    name: Heating nominal power (W)
    description: Optional. Nominal power of the heating load as configured in EMHASS (P_nom). Needed to publish heating_rate in EMHASS units (sensor.building_thermal_emhass).
  influxdb_enabled:
    name: Write to InfluxDB
    description: Store every cycle, every finished 30-min slot and an evening snapshot of tomorrow's forecast. Needed for backtests.
  influxdb_host:
    name: InfluxDB host
    description: Host name of the InfluxDB 1.x server. For the official InfluxDB add-on this is a0d7b954-influxdb.
  influxdb_port:
    name: InfluxDB port
    description: Usually 8086.
  influxdb_ssl:
    name: InfluxDB uses HTTPS
    description: Turn on only if the InfluxDB server has SSL enabled.
  influxdb_database:
    name: InfluxDB database
    description: Existing database to write into (measurements ml_layer_pv, ml_layer_pv_slot, ml_layer_dayahead).
  influxdb_username:
    name: InfluxDB user
    description: Optional. User with write access to the database.
  influxdb_password:
    name: InfluxDB password
    description: Optional. Password of the InfluxDB user.
  influxdb_dayahead_snapshot_hour:
    name: Snapshot hour
    description: Local hour from which tomorrow's forecast is saved once per day (20 = before the EMHASS day-ahead run at 20:05).
  influxdb_learn_from_history:
    name: Learn from InfluxDB history
    description: Once at start, rebuild the day-ahead model from the Solcast curves and PV power stored in InfluxDB by Home Assistant's InfluxDB integration (up to 90 days), so it does not have to wait weeks of live slots. Curtailed slots are skipped. Runs only once; the old model is kept.
