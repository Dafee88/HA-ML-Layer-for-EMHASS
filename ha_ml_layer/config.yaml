name: "HA ML Layer for EMHASS"
version: "0.6.3"
slug: "ha_ml_layer"
description: "Online-learning layer (River) for EMHASS: PV forecast correction and building thermal model"
url: "https://github.com/Dafee88/HA-ML-Layer-for-EMHASS"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
map:
  - config:rw
options:
  ha_url: "http://supervisor/core"
  poll_interval_seconds: 300
  log_level: "info"
  pv_enabled: true
  thermal_enabled: false
  pv_solcast_today: "sensor.solcast_pv_forecast_forecast_today"
  pv_solcast_tomorrow: "sensor.solcast_pv_forecast_forecast_tomorrow"
  pv_actual_power: "sensor.power_photovoltaics"
  thermal_outdoor_temp: "sensor.outdoor_temperature"
  thermal_floors:
    - name: "ground_floor"
      temperature_sensor: "sensor.ground_floor_temperature"
      heating_switch: "switch.ground_floor_heating"
  influxdb_enabled: false
  influxdb_host: "a0d7b954-influxdb"
  influxdb_port: 8086
  influxdb_ssl: false
  influxdb_database: "homeassistant"
  influxdb_dayahead_snapshot_hour: 20
  influxdb_learn_from_history: true
schema:
  ha_url: str
  poll_interval_seconds: int(60,3600)
  log_level: list(debug|info|warning|error)
  pv_enabled: bool
  thermal_enabled: bool
  latitude: float(-90,90)?
  longitude: float(-180,180)?
  timezone: str?
  pv_solcast_today: str
  pv_solcast_tomorrow: str
  pv_actual_power: str
  pv_actual_power_fallback: str?
  pv_irradiance: str?
  pv_forecast_solar_today: str?
  pv_forecast_solar_tomorrow: str?
  pv_curtailed_entity: str?
  pv_reference_irradiance: str?
  pv_peak_power_kw: float(0,)?
  thermal_outdoor_temp: str?
  thermal_outdoor_temp_fallback: str?
  thermal_heating_stage: str?
  thermal_floors:
    - name: str
      temperature_sensor: str
      heating_switch: str?
      heating_power_sensor: str?
      climate: str?
  thermal_heating_power_threshold_w: float(0,)?
  thermal_nominal_power_w: float(0,)?
  influxdb_enabled: bool
  influxdb_host: str
  influxdb_port: port
  influxdb_ssl: bool
  influxdb_database: str
  influxdb_username: str?
  influxdb_password: password?
  influxdb_dayahead_snapshot_hour: int(0,23)
  influxdb_learn_from_history: bool?
  influxdb_history_start: str?
ingress: false
hassio_api: true
homeassistant_api: true

