name: "HA ML Layer"
version: "0.3.1"
slug: "ha_ml_layer"
description: "Online-Learning-Schicht (River) für EMHASS: PV-Prognose-Korrektur und Gebäude-Wärmemodell"
url: "https://github.com/Dafee88/HA-ML-Layer-for-EMHASS"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
map:
  - config:rw
options:
  ha_url: "http://supervisor/core"
  poll_interval_seconds: 300
  log_level: "info"
  pv_enabled: true
  thermal_enabled: false
  latitude: 48.2
  longitude: 16.1
  timezone: "Europe/Vienna"
  pv_solcast_today: "sensor.solcast_pv_forecast_forecast_today"
  pv_solcast_tomorrow: "sensor.solcast_pv_forecast_forecast_tomorrow"
  pv_actual_power: "sensor.goodwe_pv_power_effective"
  pv_actual_power_fallback: "sensor.pv_power"
  pv_irradiance: "sensor.ecowitt_solar_radiation_1f335"
  thermal_outdoor_temp: "sensor.ecowitt_outdoor_temp_1f335"
  thermal_outdoor_temp_fallback: "sensor.vitocal_outdoor_temperature"
  thermal_floors:
    - name: "downstairs"
      temperature_sensor: "sensor.eve_room_e9ff_temperature"
      heating_switch: "switch.shelly1pmminig3_5432044e9dfc"
    - name: "upstairs"
      temperature_sensor: "sensor.eve_room_e49e_temperature"
      climate: "climate.smart_thermostat_x_2"
  influxdb_enabled: false
  influxdb_host: "a0d7b954-influxdb"
  influxdb_port: 8086
  influxdb_ssl: false
  influxdb_database: "homeassistant"
  influxdb_dayahead_snapshot_hour: 20
schema:
  ha_url: str
  poll_interval_seconds: int(60,3600)
  log_level: list(debug|info|warning|error)
  pv_enabled: bool
  thermal_enabled: bool
  latitude: float(-90,90)
  longitude: float(-180,180)
  timezone: str
  pv_solcast_today: str
  pv_solcast_tomorrow: str
  pv_actual_power: str
  pv_actual_power_fallback: str?
  pv_irradiance: str?
  thermal_outdoor_temp: str?
  thermal_outdoor_temp_fallback: str?
  thermal_heating_stage: str?
  thermal_floors:
    - name: str
      temperature_sensor: str
      heating_switch: str?
      climate: str?
  influxdb_enabled: bool
  influxdb_host: str
  influxdb_port: port
  influxdb_ssl: bool
  influxdb_database: str
  influxdb_username: str?
  influxdb_password: password?
  influxdb_dayahead_snapshot_hour: int(0,23)
ingress: false
hassio_api: true
homeassistant_api: true

